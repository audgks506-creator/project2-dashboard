<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드 목록</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#1f2937; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --text:#e5e7eb; --muted:#94a3b8; --accent:#60a5fa; --border:#334155; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:48px 16px; background:var(--bg); color:var(--text);
         font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
  main { max-width:880px; margin:0 auto; }
  h1 { margin:0 0 24px; font-size:28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  .card { display:block; padding:24px; background:var(--card); border:1px solid var(--border);
          border-radius:12px; color:inherit; text-decoration:none;
          transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .card:hover, .card:focus-visible { transform:translateY(-4px); border-color:var(--accent);
          box-shadow:0 8px 20px rgba(37,99,235,.18); outline:none; }
  .card:active { transform:translateY(-1px); }
  .badge { display:inline-block; margin-bottom:10px; padding:2px 10px; font-size:12px; font-weight:700;
           color:var(--accent); border:1px solid var(--accent); border-radius:999px; }
  .title { font-size:18px; font-weight:700; }
  .go { display:block; margin-top:16px; color:var(--accent); font-size:14px; }
  .go::after { content:" \2192"; display:inline-block; transition:transform .15s ease; }
  .card:hover .go::after, .card:focus-visible .go::after { transform:translateX(4px); }
</style>
</head>
<body>
<main>
  <h1>대시보드 목록</h1>
  <div class="grid">
    <a class="card" href="inspection-eda/inspection_dashboard.html">
      <span class="badge">02회차</span>
      <span class="title">inspection_dashboard.html</span>
      <span class="go">열기</span>
    </a>
    <a class="card" href="supplier-review/supplier_review.html">
      <span class="badge">03회차</span>
      <span class="title">supplier_review.html</span>
      <span class="go">열기</span>
    </a>
    <a class="card" href="order-forecast/orders_dashboard.html">
      <span class="badge">05회차</span>
      <span class="title">매장 주문량 예측 검토</span>
      <span class="go">열기</span>
    </a>
    <a class="card" href="order-forecast-06/orders_dashboard_06.html">
      <span class="badge">06회차</span>
      <span class="title">매장 주문량 예측 검토</span>
      <span class="go">열기</span>
    </a>
    <a class="card" href="order-model-08/orders_model_review.html">
      <span class="badge">08회차</span>
      <span class="title">매장 주문량 예측 모델 검토</span>
      <span class="go">열기</span>
    </a>
  </div>
</main>
</body>
</html>
